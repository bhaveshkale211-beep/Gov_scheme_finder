{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-landmark auth-logo"></i>
            <h2>Welcome Back</h2>
            <p>Login to access your scheme dashboard</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" name="username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <div class="input-eye">
                    <input type="password" name="password" id="pwd" required placeholder="Enter your password">
                    <span onclick="togglePwd('pwd')"><i class="fas fa-eye"></i></span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Login <i class="fas fa-sign-in-alt"></i></button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="{{ url_for('signup') }}">Register here</a></p>
        <p class="auth-hint"><i class="fas fa-info-circle"></i> Admin: username <strong>admin</strong>, password <strong>admin***</strong></p>
    </div>
</div>
{% endblock %}
